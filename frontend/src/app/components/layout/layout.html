<div class="min-h-screen bg-[#0a0f1c] text-slate-200">
  <nav
    class="flex items-center justify-between px-8 py-4 border-b border-slate-800 bg-[#0a0f1c]/80 backdrop-blur-md sticky top-0 z-50"
  >
    <div class="flex items-center gap-8">
      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 bg-gradient-to-tr from-cyan-400 to-blue-600 rounded-lg flex items-center justify-center"
        >
          <span class="text-white font-bold">A</span>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">ASAVA</span>
      </div>

      <div class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
        <a
          routerLink="/app/dashboard"
          routerLinkActive="text-white"
          class="hover:text-white transition-colors"
          >Dashboard</a
        >
        <a
          routerLink="/app/trading"
          routerLinkActive="text-white"
          class="hover:text-white transition-colors"
          >Trading</a
        >
        <a
          routerLink="/app/wallet"
          routerLinkActive="text-white"
          class="hover:text-white transition-colors"
          >Wallet</a
        >
        <a
          routerLink="/app/settings"
          routerLinkActive="text-white"
          class="hover:text-white transition-colors"
          >Settings</a
        >
      </div>
    </div>

    <div class="flex items-center gap-4">
      <ng-container *ngIf="!isLoggedIn">
        <a
          routerLink="/login"
          class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white cursor-pointer transition-colors"
        >
          Sign In
        </a>
        <button
          routerLink="/register"
          class="px-5 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all active:scale-95"
        >
          Get Started
        </button>
      </ng-container>

      <button
        *ngIf="isLoggedIn"
        (click)="onLogout()"
        class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-300 bg-slate-800/50 hover:bg-rose-500/10 hover:text-rose-400 border border-slate-700 hover:border-rose-500/20 rounded-xl transition-all active:scale-95"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        Log Out
      </button>
    </div>
  </nav>

  <main class="p-8">
    <router-outlet></router-outlet>
  </main>
</div>
