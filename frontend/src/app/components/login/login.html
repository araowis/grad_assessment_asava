<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl ring-1 ring-slate-200">
    <h2 class="text-center text-3xl font-bold tracking-tight text-slate-900">Sign in</h2>
    <form (ngSubmit)="onLogin()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <input [(ngModel)]="credentials.username" name="username" type="text" placeholder="Username or Email" required
          class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
        <input [(ngModel)]="credentials.password" name="password" type="password" placeholder="Password" required
          class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
      </div>
      <button type="submit" class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white hover:bg-blue-700 active:scale-[0.98] transition-all">
        Login
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-slate-600">
      Don't have an account? <a routerLink="/register" class="font-medium text-blue-600 hover:underline">Register</a>
    </p>
  </div>
</div>
