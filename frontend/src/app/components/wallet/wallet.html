<div class="space-y-8 p-6 bg-[#0a0f1c] min-h-screen">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-8">
      <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">Current Holdings</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="text-slate-500 text-xs uppercase border-b border-slate-800">
                <th class="pb-4">Asset</th>
                <th class="pb-4">Qty</th>
                <th class="pb-4">Market Value</th>
                <th class="pb-4 text-right">P&L (%)</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/50">
              <tr
                *ngFor="let stock of holdings"
                (click)="selectHolding(stock)"
                class="group hover:bg-blue-500/5 transition-all cursor-pointer"
              >
                <td class="py-4">
                  <div class="font-bold text-white group-hover:text-blue-400">
                    {{ stock.companyId }}
                  </div>
                  <div class="text-[10px] text-slate-500">Click to trade/limit</div>
                </td>
                <td class="py-4 text-slate-300 font-mono">{{ stock.quantity }}</td>
                <td class="py-4 text-white font-bold">
                  ₹{{ stock.marketValue || 0 | number: '1.2-2' }}
                </td>
                <td
                  class="py-4 text-right font-bold"
                  [ngClass]="(stock.pnl || 0) >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                >
                  {{ (stock.pnl || 0) >= 0 ? '+' : ''
                  }}{{ stock.pnlPercent || 0 | number: '1.1-2' }}%
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div *ngIf="selectedStock" class="animate-in slide-in-from-bottom-4 duration-500">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <span class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span>
            Trading Terminal: {{ selectedStock.symbol }}
          </h3>
          <button (click)="selectedStock = null" class="text-slate-500 hover:text-white text-xs">
            Close Terminal
          </button>
        </div>

        <app-trading
          [userId]="userId"
          [companyId]="selectedStock.symbol"
          [currentPrice]="selectedStock.price"
          [portfolioGroupId]="selectedPortfolioId"
          [mode]="'portfolio'"
        >
        </app-trading>
      </div>
    </div>

    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6"></div>
  </div>
</div>
