<div
  *ngIf="companyId && userId; else loadingTemplate"
  class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500"
>
  <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
    <div class="xl:col-span-3">
      <div
        class="bg-[#111827] border border-slate-800 rounded-2xl p-6 min-h-[500px] flex flex-col relative overflow-hidden"
      >
        <div
          class="absolute top-4 right-4 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest border"
          [ngClass]="
            mode === 'portfolio'
              ? 'bg-amber-500/10 text-amber-500 border-amber-500/20'
              : 'bg-blue-500/10 text-blue-500 border-blue-500/20'
          "
        >
          {{ mode === 'portfolio' ? 'Portfolio Terminal' : 'Market Exchange' }}
        </div>

        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-4">
            <span class="text-2xl font-bold text-white uppercase">{{ companyId }} / INR</span>
            <span class="text-emerald-400 font-mono text-xl">
              ₹{{ currentPrice | number: '1.2-2' }}
            </span>
          </div>
          <div class="flex gap-2">
            <button
              *ngFor="let tf of ['1H', '4H', '1D']"
              (click)="setTimeframe(tf)"
              [class]="
                selectedTimeframe === tf ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'
              "
              class="px-3 py-1 rounded text-xs font-medium transition-all"
            >
              {{ tf }}
            </button>
          </div>
        </div>

        <div class="flex-grow flex items-end gap-1 px-2 pb-4">
          <div
            *ngFor="let i of [40, 60, 45, 70, 85, 60, 75, 90, 55, 70, 65, 80, 50, 95]"
            [style.height.%]="i"
            class="flex-grow bg-gradient-to-t from-blue-600/20 to-blue-500/50 rounded-t-sm border-t border-blue-400"
          ></div>
        </div>
      </div>
    </div>

    <div class="space-y-6">
      <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 sticky top-6">
        <div class="flex p-1 bg-[#0a0f1c] rounded-lg mb-6">
          <button
            (click)="order.type = 'BUY'"
            [class]="
              order.type === 'BUY' ? 'bg-emerald-600 text-white shadow-lg' : 'text-slate-400'
            "
            class="flex-1 py-2 rounded-md font-bold transition-all text-xs"
          >
            BUY
          </button>
          <button
            *ngIf="mode === 'portfolio'"
            (click)="order.type = 'SELL'"
            [class]="order.type === 'SELL' ? 'bg-rose-600 text-white shadow-lg' : 'text-slate-400'"
            class="flex-1 py-2 rounded-md font-bold transition-all text-xs"
          >
            SELL
          </button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-[10px] text-slate-500 uppercase font-bold mb-1 block"
              >Limit Price</label
            >
            <input
              [(ngModel)]="order.price"
              type="number"
              step="0.01"
              class="w-full bg-[#0a0f1c] border border-slate-800 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 transition-colors"
            />
          </div>

          <div *ngIf="mode === 'portfolio'" class="animate-in slide-in-from-top-2 duration-300">
            <label class="text-[10px] text-amber-500 uppercase font-bold mb-1 block">
              Safe Limit (Stop Loss)
            </label>
            <input
              [(ngModel)]="order.stopLoss"
              type="number"
              step="0.01"
              placeholder="Trigger price"
              class="w-full bg-[#0a0f1c] border border-amber-500/30 rounded-xl px-4 py-3 text-white outline-none focus:border-amber-500 transition-colors"
            />
            <p class="text-[9px] text-slate-600 mt-1 italic">
              Automated sell if price drops below this.
            </p>
          </div>

          <div>
            <label class="text-[10px] text-slate-500 uppercase font-bold mb-1 block"
              >Quantity</label
            >
            <input
              [(ngModel)]="order.quantity"
              type="number"
              min="1"
              class="w-full bg-[#0a0f1c] border border-slate-800 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 transition-colors"
            />
          </div>

          <div class="pt-4 border-t border-slate-800">
            <div class="flex justify-between text-xs mb-4">
              <span class="text-slate-500">Est. Total</span>
              <span class="text-white font-bold font-mono">
                ₹{{ order.price * order.quantity | number: '1.2-2' }}
              </span>
            </div>

            <button
              (click)="submitOrder()"
              [disabled]="isLoadingOrder"
              [class]="
                order.type === 'BUY'
                  ? 'bg-emerald-600 hover:bg-emerald-500'
                  : 'bg-rose-600 hover:bg-rose-500'
              "
              class="w-full py-4 rounded-xl text-white font-bold transition-all active:scale-95 disabled:opacity-50"
            >
              <span *ngIf="!isLoadingOrder">Place {{ order.type }} Order</span>
              <span *ngIf="isLoadingOrder" class="flex items-center justify-center gap-2">
                <div
                  class="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin"
                ></div>
                Executing...
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingTemplate>
  <div
    class="flex flex-col items-center justify-center h-[500px] bg-[#111827] border border-slate-800 rounded-2xl"
  >
    <div
      class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"
    ></div>
    <p class="text-slate-500 text-sm animate-pulse">Initializing Terminal...</p>
  </div>
</ng-template>
